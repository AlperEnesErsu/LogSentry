# ============================================================================
#  LogSentry -- konteyner kurulumu
# ----------------------------------------------------------------------------
#  Mimarideki uc process'in birebir karsiligi (bkz. ARCHITECTURE.md):
#
#     logsentry      -> access.log'u izler, kural isletir, uyari uretir
#     logsentry-web  -> tarayiciya hizmet eder (:4567)
#     traffic        -> gelistirme icin sahte trafik uretir
#
#  Neden ayri konteynerler? Web arayuzu cokerse IZLEME DURMAMALI. Guvenlik
#  izlemesini bir web sunucusunun kaderine baglamak kotu muhendisliktir.
#
#  Calistirmak icin:
#     docker compose up --build
#     tarayici: http://localhost:4567
#
#  NOT: `version:` alani Compose v2'de kullanimdan kalkti; yazilirsa
#  "obsolete" uyarisi verir. O yuzden yok.
# ============================================================================

services:
  # --- Izleyici servis ------------------------------------------------------
  logsentry:
    build: .
    # --from-begin: konteyner ilk kalktiginda mevcut logun tamamini isle.
    # (Uretimde dikkatli kullan -- Tailer'in checkpoint dosyasi zaten kaldigi
    #  yerden devam etmeyi sagliyor.)
    command: bin/logsentry --from-begin
    volumes:
      - ./logs:/app/logs
      - ./db:/app/db
      - ./archive:/app/archive
      # Yapilandirma SALT OKUNUR baglaniyor: konteynerin kendi kurallarini
      # degistirebilmesi icin hicbir sebep yok.
      - ./config:/app/config:ro
    environment:
      # Webhook adresi ORTAM DEGISKENINDEN gelir, dosyadan degil.
      # Kullanmak icin: export LOGSENTRY_WEBHOOK_URL=https://...
      - LOGSENTRY_WEBHOOK_URL=${LOGSENTRY_WEBHOOK_URL:-}
      - LOGSENTRY_TELEGRAM_CHAT_ID=${LOGSENTRY_TELEGRAM_CHAT_ID:-}
    restart: unless-stopped

  # --- Web arayuzu ----------------------------------------------------------
  logsentry-web:
    build: .
    # DIKKAT: --bind 0.0.0.0 burada ZORUNLU.
    # Konteyner icinde 127.0.0.1'e baglanan bir servise disaridan erisilemez;
    # port yonlendirmesi calismaz.
    #
    # Bunun bedeli: arayuz artik konteyner icinde localhost ile sinirli DEGIL.
    # Guvenligi asagidaki `ports` satiri sagliyor -- "127.0.0.1:4567:4567"
    # yazarak portu yalnizca bu makineye aciyoruz. Sunucuya kurarsan Nginx +
    # TLS + kimlik dogrulama arkasina al.
    command: bin/logsentry-web --bind 0.0.0.0 --port 4567
    ports:
      - "127.0.0.1:4567:4567"
    volumes:
      - ./logs:/app/logs
      - ./db:/app/db
      - ./archive:/app/archive
      - ./config:/app/config:ro
    depends_on:
      - logsentry
    restart: unless-stopped
    # Saglik kontrolu YALNIZCA bu serviste: diger iki servis HTTP konusmuyor.
    # (Imaja gomseydik hepsi devralir ve digerleri hep "unhealthy" gorunurdu.)
    #
    # "Process ayakta mi" diye bakmak yetmez -- ayakta ama yanit vermeyen bir
    # servis en sinsi arizadir. O yuzden gercek bir istek atiyoruz.
    healthcheck:
      test: ["CMD", "ruby", "-e", "require 'net/http'; exit(Net::HTTP.get_response(URI('http://127.0.0.1:4567/health')).is_a?(Net::HTTPSuccess) ? 0 : 1)"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

  # --- Bakim: arsivleme + saklama suresi temizligi --------------------------
  #  Yapilandirmadaki iki saklama suresini (storage.hot_retention_days ve
  #  archive.retention_days) UYGULAYAN servis. Bu servis olmadan o degerler
  #  yalnizca bir niyet beyani olarak kalir: kod var, cagiran yok.
  #
  #  Neden ayri bir konteyner? Cunku bu is periyodik ve KISA sureli; izleyici
  #  servisin icine koymak, izlemeyi bakim isinin kaderine baglardi
  #  (VACUUM veritabanini kilitler, sikistirma CPU yer).
  #
  #  Neden `sleep` donguSU, cron degil? Imajda cron yok ve konteynerde cron
  #  calistirmak icin ayri bir supervisor gerekir. Bare-metal kurulumda
  #  dogru arac systemd timer'dir: deploy/logsentry-archive.timer
  #  (o, kacirilan calistirmayi da telafi eder -- bu dongu edemez).
  #
  #  ONCE calistirip SONRA uyuyor: konteyner her kalktiginda bakim bir kez
  #  kosar. Tersi olsaydi, gunde bir yeniden baslatilan bir kurulumda
  #  temizlik hicbir zaman calismazdi.
  logsentry-maintenance:
    build: .
    command: >
      sh -c 'while true; do
               bin/logsentry-archive --all || echo "[bakim] cikis kodu $$? -- arsiv butunlugunu kontrol et";
               sleep 86400;
             done'
    volumes:
      - ./logs:/app/logs
      - ./db:/app/db
      - ./archive:/app/archive
      - ./config:/app/config:ro
    depends_on:
      - logsentry
    restart: unless-stopped

  # --- Sahte trafik (yalnizca gelistirme) -----------------------------------
  #  `profiles` sayesinde varsayilan `docker compose up` ile BASLAMAZ.
  #  Baslatmak icin:  docker compose --profile demo up
  #
  #  Onceki surumde burada `tools/log_generator.rb --rate 10` yaziyordu.
  #  O betik konumsal arguman aliyor (satir sayisi, dosya) ve "--rate"
  #  degerini 0 satir olarak yorumluyordu: hicbir sey yazmadan hemen cikiyor,
  #  `restart: unless-stopped` ile de sonsuz yeniden baslatma dongusune
  #  giriyordu. Surekli akis uretmek live_writer.rb'nin isi.
  traffic:
    build: .
    profiles: [demo]
    command: ruby tools/live_writer.rb --attack brute --rps 10
    volumes:
      - ./logs:/app/logs
    restart: unless-stopped
